[env:nucleo_f303k8]
platform = ststm32
board = nucleo_f303k8
framework = arduino
upload_protocol = stlink
; F303K8 has only 12KB RAM; OpenOCD's stm32f3x default work area (16KB) overruns it
upload_flags = -c
    set WORKAREASIZE 0x2000
monitor_speed = 460800
; Larger UART ring buffers so RTK bursts (RTCM/binary + NMEA) aren't dropped
build_flags =
    -DSERIAL_RX_BUFFER_SIZE=1024
    -DSERIAL_TX_BUFFER_SIZE=1024
